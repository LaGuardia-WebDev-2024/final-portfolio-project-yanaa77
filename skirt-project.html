<!DOCTYPE html>
<html>

<head>
    <title>My Sewn Skirt</title>

    <style>
body {
    text-align: center;
    font-family: Arial;
    background-color: #f5f5f5;
    padding: 30px;
}

h1 {
    margin-bottom: 30px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    justify-items: center;
}

img {
    width: 550px;
    height: auto;
    border-radius: 15px;
    transition: transform 0.3s ease;
}

img:hover {
    transform: scale(1.12);
}
</style>


</head>

<body>

    <h1>Denim Up-Cycling Piece</h1>

    <div class="gallery">
    <img src="skirt/skirt frontt.jpg" />
    <img src="skirt/skirt back.jpg" />
    <img src="skirt/skirt mannequin.jpg" />
    <img src="skirt/skirt lace.jpg" />
    <img src="skirt/lacee.jpg" />
    <img src="skirt/skirt mannequin back.jpg" />
</div>


</body>

</html>
