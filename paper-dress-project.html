<!DOCTYPE html>
<html>
<head>
<style>
.gallery {
    column-count: 2;
    column-gap: 50px;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.gallery img {
    width: 100%;
    margin-bottom: 20px;
    border-radius: 10px;
    display: block;
    break-inside: avoid;
    transition: transform 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>My Paper Dress</h1>

<div class="gallery">

<img src="paper dress/dress pretty.jpg" />
<img src="paper dress/dress show.jpg" />
<img src="paper dress/dress paper.jpg" />
<img src="paper dress/dress on model.jpg" />

</div>

</body>
</html>
