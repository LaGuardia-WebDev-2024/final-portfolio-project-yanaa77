<!DOCTYPE html>
<html>
<head>
  <title>Original garment inspired by fabric</title> 

  <style>
  body {
    text-align: center;
    font-family: Arial;
    background-color: #f5f5f5;
    padding: 30px;
  }

  h1 {
    margin-bottom: 30px;
  }

  

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  justify-items: center;
}



img {
  width: 500px;
  height: auto;
  border-radius: 15px;
  transition: transform 0.3s ease;
}

img:hover {
  transform: scale(1.12); 
}



</style> 

<body>

<h1>Original Garment Inspired by Fabric</h1>

<div class="gallery">
  <img src="images/teal/front teal.jpg" />
  <img src="images/teal/back teal.jpg" />
  <img src="images/teal/mannequin front.jpg" />
  <img src="images/teal/mannequin back.jpg" />
  <img src="images/teal/mannequin side.jpg" />
  <img src="images/teal/mirror.jpg" />
</div>

</body>
